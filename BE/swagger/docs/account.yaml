openapi: 3.0.0
info:
  title: EvelynBeauty API
  version: 1.0.0
  description: Tài liệu xác thực và bảo mật API

tags:
  - name: Auth
    description: Các API xác thực người dùng (login, register, Google, OTP, mật khẩu)
  - name: Protected
    description: Các API yêu cầu xác thực bằng Bearer Token (JWT)

paths:
  /auth/login:
    post:
      tags:
        - Auth
      summary: Đăng nhập bằng email và mật khẩu
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: testuser02@gmail.com
                password:
                  type: string
                  example: "123456"
      responses:
        200:
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Đăng nhập thành công
                  account:
                    type: object
                    properties:
                      accountId:
                        type: string
                        example: AC17508068487986
                      name:
                        type: string
                        example: chokhanh
                      email:
                        type: string
                        example: testuser02@gmail.com
                      role:
                        type: string
                        example: CU
                  token:
                    type: string
                    example: >-
                      eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        401:
          description: Mật khẩu không đúng
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Mật khẩu không đúng
        404:
          description: Tài khoản không tồn tại
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Tài khoản không tồn tại

  /auth/register:
    post:
      tags:
        - Auth
      summary: Đăng ký tài khoản người dùng mới
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: chokhanh
                email:
                  type: string
                  example: testuser02@gmail.com
                password:
                  type: string
                  example: "123456"
      responses:
        201:
          description: Đăng ký thành công

  /auth/verify-otp:
    post:
      tags:
        - Auth
      summary: Xác minh mã OTP từ email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: testuser02@gmail.com
                otp:
                  type: string
                  example: "938241"
      responses:
        200:
          description: OTP hợp lệ

  /auth/forgot-password:
    post:
      tags:
        - Auth
      summary: Gửi email đặt lại mật khẩu (JWT không lưu DB)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: testuser02@gmail.com
      responses:
        200:
          description: Gửi email thành công

  /auth/reset-password:
    post:
      tags:
        - Auth
      summary: Đặt lại mật khẩu bằng JWT từ email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  example: eyJhbGciOiJIUzI1NiIsInR5c...
                newPassword:
                  type: string
                  example: "newpassword123"
      responses:
        200:
          description: Đổi mật khẩu thành công

  /auth/logout:
    post:
      tags:
        - Auth
      summary: Đăng xuất tài khoản
      security:
        - bearerAuth: []
      responses:
        200:
          description: Đăng xuất thành công

  /auth/home:
    get:
      tags:
        - Protected
      summary: Truy cập trang chính (vai trò CU, SF, OS)
      security:
        - bearerAuth: []
      responses:
        200:
          description: Truy cập thành công

  /auth/manage:
    get:
      tags:
        - Protected
      summary: Truy cập trang quản lý (chỉ dành cho SF và OS)
      security:
        - bearerAuth: []
      responses:
        200:
          description: Truy cập thành công
