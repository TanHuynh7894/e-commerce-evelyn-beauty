<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Google Login Demo</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      function handleCredentialResponse(response) {
        console.log("✅ ID Token:", response.credential);

        // Gửi lên backend
        fetch("http://localhost:3000/auth/google", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            credential: response.credential,
            action: "register"
          }),
        })
          .then((res) => res.json())
          .then((data) => {
            console.log("🟢 Server response:", data);
            alert(JSON.stringify(data, null, 2));
          })
          .catch((err) => {
            console.error("❌ Lỗi gửi về backend:", err);
          });
      }

      window.onload = function () {
        google.accounts.id.initialize({
          client_id: "999350037356-j4dip6ho0ma3sgd6gh91hje69ensot0g.apps.googleusercontent.com",
          callback: handleCredentialResponse,
        });

        google.accounts.id.renderButton(
          document.getElementById("g-login-btn"),
          { theme: "outline", size: "large",text: "signup_with" }
        );

        google.accounts.id.prompt(); // Hiện One Tap popup
      };
    </script>
  </head>
  <body>
    <h2>Đăng kí bằng Google</h2>
    <div id="g-login-btn"></div>
  </body>
</html>
